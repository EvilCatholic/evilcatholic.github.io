	/* lado esquerdo mais escuro para o texto, vinheta e cintilação de projetor */
	#sombra { position: absolute; top: 0; left: 0; width: 100%; height: 100%;
		background: linear-gradient(90deg, rgba(8,7,6,.94) 0%, rgba(8,7,6,.75) 40%, rgba(8,7,6,.15) 75%, rgba(8,7,6,.4) 100%); }
	#vinheta { position: absolute; top: 0; left: 0; width: 100%; height: 100%; box-shadow: inset 0 0 220px 60px #000; }
	#cintila { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000; opacity: 0;
		-webkit-animation: cintila 4s infinite; animation: cintila 4s infinite; }
	@-webkit-keyframes cintila { 0%, 100% { opacity: 0; } 3% { opacity: .08; } 6% { opacity: 0; } 51% { opacity: .05; } 53% { opacity: 0; } }
	@keyframes cintila { 0%, 100% { opacity: 0; } 3% { opacity: .08; } 6% { opacity: 0; } 51% { opacity: .05; } 53% { opacity: 0; } }

	#conteudo { position: absolute; left: 8%; top: 14%; width: 46%; text-shadow: 0 2px 6px #000, 0 0 2px #000; }
	#chapeu { font-family: 'Stardos Stencil', serif; font-size: 18px; letter-spacing: 6px; color: #b89a5e; }
	h1 { font-family: 'Stardos Stencil', serif; font-weight: 700; font-size: 76px; line-height: 1; margin: 10px 0 8px; letter-spacing: 3px; color: #efe6cf; white-space: nowrap; }
	#sub { font-style: italic; font-weight: 300; font-size: 22px; color: #cdbf9e; }
	hr { border: 0; border-top: 1px solid rgba(225,205,160,.35); margin: 34px 0 26px; width: 70%; }

	#boletim-rotulo { font-family: 'Stardos Stencil', serif; font-size: 15px; letter-spacing: 4px; color: #a8343a; }
	#boletim { font-size: 21px; font-weight: 300; line-height: 1.55; min-height: 100px; margin-top: 10px; opacity: 1;
		-webkit-transition: opacity .8s; transition: opacity .8s; }

	#rodape { position: absolute; left: 8%; right: 8%; bottom: 7%; text-shadow: 0 2px 4px #000; }
	#linha { overflow: hidden; font-size: 15px; color: #cdbf9e; margin-bottom: 10px; }
	#status { float: left; }
	#mapa { float: right; font-family: 'Stardos Stencil', serif; letter-spacing: 2px; }
	#barra { height: 6px; background: rgba(225,205,160,.15); border: 1px solid rgba(225,205,160,.3); }
	#progresso { height: 100%; width: 0%; background: #c9a24a; -webkit-transition: width .4s; transition: width .4s; }
	#arquivo { margin-top: 8px; font-size: 12px; color: rgba(205,191,158,.6); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style>
</head>
<body>
	<div id="foto"></div>
	<div id="sombra"></div>
	<div id="vinheta"></div>
	<div id="cintila"></div>

	<div id="conteudo">
		<div id="chapeu">FRENTE OCIDENTAL &middot; YPRES &middot; 1917</div>
		<h1>A GRANDE GUERRA</h1>
		<div id="sub" class="servidor">Apresentando-se ao front&hellip;</div>
		<hr>
		<div id="boletim-rotulo">BOLETIM DO FRONT</div>
		<div id="boletim"></div>
	</div>

	<div id="rodape">
		<div id="linha"><span id="status">A caminho da linha de frente&hellip;</span><span id="mapa"></span></div>
		<div id="barra"><div id="progresso"></div></div>
		<div id="arquivo"></div>
	</div>

<script>
	// boletins e conselhos que giram enquanto carrega (edite à vontade)
	var boletins = [
		"Chuva contínua. Trincheira de comunicação alagada até a cintura. Troque as meias duas vezes ao dia.",
		"Atiradores ativos no saliente. Não levante a cabeça acima do parapeito.",
		"Cuide dos nervos como cuida dos pés: fique perto dos camaradas, fume um cigarro, escreva para casa.",
		"Ferido? Aplique o curativo de campanha e chame o padioleiro. Sangrar sozinho na lama é morrer.",
		"Alerta de gás: máscara ao alcance da mão. Ao ouvir o sino, segundos importam.",
		"Ração de rum autorizada antes do amanhecer.",
		"O correio chegou do interior. As cartas serão entregues depois do stand-to.",
		"Lampião aceso à noite é alvo para o atirador do outro lado.",
		"Obedeça à cadeia de comando. O mundo de 1917 não conhece o seu."
	];

	var atual = -1;
	function proximo() {
		var el = document.getElementById("boletim");
		el.style.opacity = 0;
		setTimeout(function () {
			var n;
			do { n = Math.floor(Math.random() * boletins.length); } while (n == atual && boletins.length > 1);
			atual = n;
			el.innerHTML = boletins[n];
			el.style.opacity = 1;
		}, 800);
	}
	proximo();
	setInterval(proximo, 9000);

	// chamadas que o Garry's Mod faz na tela de carregamento
	var total = 0, faltam = 0;

	function GameDetails(servername, serverurl, mapname, maxplayers, steamid, gamemode) {
		if (servername) { document.getElementById("sub").innerHTML = servername; }
		if (mapname) { document.getElementById("mapa").innerHTML = mapname; }
	}

	function SetFilesTotal(n) { total = n; atualiza(); }
	function SetFilesNeeded(n) { faltam = n; atualiza(); }
	function DownloadingFile(nome) { document.getElementById("arquivo").innerHTML = nome; }

	function SetStatusChanged(status) {
		var traducao = {
			"Retrieving server info": "Recebendo ordens do quartel-general",
			"Sending client info...": "Apresentando a caderneta",
			"Client info sent!": "Caderneta conferida",
			"Starting Lua...": "Montando as trincheiras",
			"Lua started!": "Trincheiras prontas",
			"Workshop Complete": "Suprimentos recebidos",
			"Mounting Addons": "Distribuindo o equipamento",
			"Parsing Game Info": "Lendo o mapa do setor"
		};
		document.getElementById("status").innerHTML = traducao[status] || status;
		if (status == "Sending client info...") { document.getElementById("progresso").style.width = "100%"; }
	}

	function atualiza() {
		if (total > 0) {
			var feito = Math.max(0, total - faltam);
			document.getElementById("progresso").style.width = Math.min(100, feito / total * 100) + "%";
		}
	}
</script>
</body>
</html>
